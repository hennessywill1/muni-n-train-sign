<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muni N Train - Carl & Cole</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .header h1 {
            font-size: clamp(32px, 8vw, 64px);
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
        }
        
        .header p {
            font-size: clamp(16px, 4vw, 24px);
            color: #666;
        }
        
        .arrivals {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .arrival-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }
        
        .arrival-card.next {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border-color: #1e40af;
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.3);
            transform: scale(1.02);
        }
        
        .arrival-time {
            font-size: clamp(36px, 10vw, 72px);
            font-weight: 700;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        
        .arrival-vehicle {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 0.5rem;
        }
        
        .arrival-card:not(.next) {
            color: #1a1a1a;
            border-color: #e0e0e0;
        }
        
        .loading {
            text-align: center;
            color: #666;
            font-size: 18px;
            padding: 2rem;
        }
        
        .error {
            background: #fee2e2;
            border: 2px solid #fca5a5;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            color: #991b1b;
        }
        
        .error-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .error-text {
            font-size: 14px;
            line-height: 1.5;
        }
        
        .footer {
            text-align: center;
            font-size: 13px;
            color: #999;
        }
        
        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }
            
            .header {
                margin-bottom: 2rem;
            }
            
            .arrival-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚊 N Train</h1>
            <p>Carl & Cole → Downtown</p>
        </div>
        
        <div class="arrivals" id="arrivals-container">
            <div class="loading">Loading arrivals...</div>
        </div>
        
        <div class="footer">
            <span id="last-update">Updating...</span>
        </div>
    </div>

    <script>
        // Replace YOUR_PROJECT_NAME with your actual Vercel project name
        const API_URL = 'https://YOUR_PROJECT_NAME.vercel.app/api';
        
        async function fetchArrivals() {
            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`API returned ${response.status}`);
                }
                
                const predictions = await response.json();
                renderArrivals(predictions);
            } catch (error) {
                console.error('Error fetching arrivals:', error);
                renderError(error);
            }
            
            updateTimestamp();
        }
        
        function renderArrivals(predictions) {
            const container = document.getElementById('arrivals-container');
            
            if (!predictions || predictions.length === 0) {
                container.innerHTML = '<div class="loading">No downtown trains available right now</div>';
                return;
            }
            
            container.innerHTML = predictions.map((pred, idx) => {
                const minuteText = pred.minutes === 0 ? 'Now' : `${pred.minutes} min`;
                const isNext = idx === 0;
                
                return `
                    <div class="arrival-card ${isNext ? 'next' : ''}">
                        <div class="arrival-time">${minuteText}</div>
                        ${pred.vehicle ? `<div class="arrival-vehicle">Vehicle ${pred.vehicle}</div>` : ''}
                    </div>
                `;
            }).join('');
        }
        
        function renderError(error) {
            const container = document.getElementById('arrivals-container');
            container.innerHTML = `
                <div class="error">
                    <div class="error-title">Unable to load arrivals</div>
                    <div class="error-text">Make sure the API URL is set correctly in the code, or check your connection and refresh the page.</div>
                </div>
            `;
        }
        
        function updateTimestamp() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: true 
            });
            document.getElementById('last-update').textContent = `Last updated: ${timeStr}`;
        }
        
        // Initial fetch
        fetchArrivals();
        
        // Auto-refresh every 30 seconds
        setInterval(fetchArrivals, 30000);
    </script>
</body>
</html>
